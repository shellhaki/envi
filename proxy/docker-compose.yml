services:
  api-proxy:
    image: alpine/socat
    container_name: envi-api-proxy
    restart: unless-stopped
    command: TCP-LISTEN:8080,fork,reuseaddr TCP:host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.envi-api.rule=Host(`api.envisecrets.com`)
      - traefik.http.routers.envi-api.entrypoints=websecure
      - traefik.http.routers.envi-api.tls.certresolver=letsencrypt
      - traefik.http.services.envi-api.loadbalancer.server.port=8080

  install-proxy:
    image: alpine/socat
    container_name: envi-install-proxy
    restart: unless-stopped
    command: TCP-LISTEN:8081,fork,reuseaddr TCP:host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.envi-install.rule=Host(`install.envisecrets.com`)
      - traefik.http.routers.envi-install.entrypoints=websecure
      - traefik.http.routers.envi-install.tls.certresolver=letsencrypt
      - traefik.http.services.envi-install.loadbalancer.server.port=8081

networks:
  dokploy-network:
    external: true
