# The install-script Worker for install.envisecrets.com. No secrets or vars: deploy with `bun run deploy`.
name = "envi-install"
main = "index.ts"
compatibility_date = "2026-11-01"
routes = [{ pattern = "install.envisecrets.com", custom_domain = true }]

# Bundles ../scripts/install.sh and install.ps1 into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.sh", "**/*.ps1"]
fallthrough = true
