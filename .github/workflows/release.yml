name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The build reads .env.cli, so CI writes one from the repository secret
      # rather than inventing a second mechanism. Without the secret the file is
      # absent and the compiled defaults stand, which for a stamped build is the
      # hosted API — a missing secret cannot ship a binary pointing nowhere.
      - name: Write CLI build settings
        env:
          ENV_CLI: ${{ secrets.ENV_CLI }}
        run: |
          if [ -n "$ENV_CLI" ]; then
            printf '%s\n' "$ENV_CLI" > .env.cli
            echo "wrote .env.cli with $(grep -c '=' .env.cli) setting(s)"
          else
            echo "no ENV_CLI secret; building with compiled defaults"
          fi
          echo "CLI_LDFLAGS=$(make -s cli-ldflags)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_LDFLAGS: ${{ env.CLI_LDFLAGS }}

  # npm packages, published after the GitHub release so a failure here never
  # leaves a half-made release behind.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets npm attach build provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Same build settings the CLI release uses, so an npm-installed binary
      # talks to the same API as one from the install script.
      - name: Write CLI build settings
        env:
          ENV_CLI: ${{ secrets.ENV_CLI }}
        run: |
          if [ -n "$ENV_CLI" ]; then printf '%s\n' "$ENV_CLI" > .env.cli; fi
          echo "CLI_LDFLAGS=$(make -s cli-ldflags)" >> "$GITHUB_ENV"

      - name: Build the packages
        run: node npm/build.mjs "${GITHUB_REF_NAME}"

      # Order matters: the wrapper depends on exact versions of the platform
      # packages, so those have to exist on the registry first.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/dist/envi-cli-*/; do
            echo "publishing $dir"
            npm publish "$dir" --access public --provenance
          done

      - name: Publish the CLI wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/dist/envi-cli --access public --provenance

      - name: Publish the SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd sdk
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm install
          npm run build
          npm publish --access public --provenance
