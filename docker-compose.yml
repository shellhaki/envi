services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: envi
      POSTGRES_USER: envi
      POSTGRES_PASSWORD: envi
    ports: ["5342:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envi -d envi"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
